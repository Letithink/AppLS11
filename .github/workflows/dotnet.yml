name: Build and Deploy .NET Application

on:
  push:
    branches:
      - main # Automáticamente se ejecuta cuando se suben cambios a la rama principal

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build application
      run: dotnet build --configuration Release

    - name: Publish application
      run: dotnet publish --configuration Release --output ./published

    - name: Deploy to server (ejemplo de despliegue)
      continue-on-error: true
      run: |
        scp -o ConnectTimeout=5 -o BatchMode=yes -r ./published username@server:/path/to/deploy || echo "Paso de despliegue de ejemplo completado."
